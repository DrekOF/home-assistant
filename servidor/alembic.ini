# Nombre: alembic.ini
# Descripción: Configuración de Alembic para las migraciones del servidor de AccesIA.
# Fecha de creación: 2026-11-11
# Actualización: 2026-11-11
# Autor: Equipo AccesIA
# Versión: 1.0
#
# La URL de la base no va aquí: sale de DATABASE_URL (accesia.config).

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
