# Nombre: servidor.yml
# Descripción: CI del servidor de AccesIA: corre pytest con PostgreSQL 18 + pgvector y Mosquitto en contenedores (RNF-06 · C3).
# Fecha de creación: 2026-11-11
# Actualización: 2026-11-11
# Autor: Equipo AccesIA
# Versión: 1.0
#
# Es solo del servidor: la web tiene web.yml (tarea C) y el firmware se suma el Día 4.

name: Servidor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del servidor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Correr las pruebas
        run: uv run pytest
