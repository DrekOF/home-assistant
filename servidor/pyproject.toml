# Nombre: pyproject.toml
# Descripción: Proyecto Python del servidor de AccesIA (frente B): dependencias, pruebas y empaquetado con uv.
# Fecha de creación: 2026-11-11
# Actualización: 2026-11-11
# Autor: Equipo AccesIA
# Versión: 1.0

[project]
name = "accesia"
version = "0.1.0"
description = "Servidor de AccesIA: huella de la cara, reglas, API, MQTT y servidor MCP del agente."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "paho-mqtt>=2.1",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accesia"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-ra"
markers = [
    "marca(texto): código de la spec o del contrato que comprueba la prueba, por ejemplo «contrato MQTT · acl»",
]
