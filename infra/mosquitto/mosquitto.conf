# Nombre: mosquitto.conf
# Descripción: Configuración de Mosquitto 2 para AccesIA: puerto 1883, sin acceso anónimo, con claves y ACL.
# Fecha de creación: 2026-11-11
# Actualización: 2026-11-11
# Autor: Equipo AccesIA
# Versión: 1.0
#
# Contrato: specs/contratos/mqtt.md. Las claves las crea infra/scripts/crear-claves-mqtt.ps1 (o .sh).

# Sin un listener explícito, Mosquitto 2 solo escucha dentro del contenedor.
listener 1883
allow_anonymous false
password_file /mosquitto/config/claves/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
