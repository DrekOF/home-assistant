# Nombre: firmware.yml
# Descripción: CI del firmware de AccesIA: compila la ESP32-CAM (D-24) y la XIAO ESP32-C6 (D-21), y corre las pruebas de la lógica pura (RNF-06 · C3).
# Fecha de creación: 2026-11-12
# Actualización: 2026-11-19
# Autor: Equipo AccesIA
# Versión: 1.1
#
# Compila cada target con la imagen oficial de ESP-IDF 5.4.4 y revisa que su dependencies.lock esté al día. Prueba
# la lógica pura con doctest en ubuntu-24.04, como firmware/scripts/probar-logica.ps1 en el equipo.

name: Firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilación del firmware (${{ matrix.target }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32      # la ESP32-CAM de la demo (D-24)
            carpeta: build-esp32cam
          - target: esp32c6    # la XIAO ESP32-C6 (D-21, sin uso desde D-24)
            carpeta: build-c6
    steps:
      - uses: actions/checkout@v4

      - name: Compilar para ${{ matrix.target }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -B ${{ matrix.carpeta }} -D SDKCONFIG="$PWD/${{ matrix.carpeta }}/sdkconfig" -D IDF_TARGET=${{ matrix.target }} build
          idf.py -B ${{ matrix.carpeta }} -D SDKCONFIG="$PWD/${{ matrix.carpeta }}/sdkconfig" size

      - name: Revisar que dependencies.lock.${{ matrix.target }} esté al día con idf_component.yml
        shell: bash
        run: git diff --exit-code -- firmware/dependencies.lock.${{ matrix.target }}

  pruebas:
    name: Pruebas de la lógica pura del firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Correr las pruebas (doctest)
        run: bash firmware/scripts/probar-logica.sh
