# Nombre: acl.conf
# Descripción: Configuración extra del complemento oficial de Mosquitto en la Pi (D-22): le dice dónde está la ACL de contratos/mqtt.md. Va en /share/mosquitto/acl.conf, con «customize» activo y la carpeta «mosquitto».
# Fecha de creación: 2026-11-18
# Actualización: 2026-11-18
# Autor: Equipo AccesIA
# Versión: 1.0
# La ACL va al lado, en /share/mosquitto/accesscontrollist, sin extensión .conf para que el complemento no la lea como configuración.
acl_file /share/mosquitto/accesscontrollist
