# Nombre: pyproject.toml
# Descripción: Proyecto Python del servidor de AccesIA (frente B): dependencias, pruebas y empaquetado con uv.
# Fecha de creación: 2026-11-11
# Actualización: 2026-11-18
# Autor: Equipo AccesIA
# Versión: 1.6

[project]
name = "accesia"
version = "0.1.0"
description = "Servidor de AccesIA: huella de la cara, reglas, API, MQTT y servidor MCP del agente."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    # El modo extraer pide los cuadros de las cámaras de respaldo por HTTP (RF-10 · C4).
    "httpx>=0.28",
    "itsdangerous>=2.2.0",
    # SDK oficial de MCP (contratos/mcp-agente.md): en la 2.x, FastMCP se llama MCPServer.
    "mcp>=2.3,<3",
    "numpy>=2.2",
    "opencv-python-headless==4.14.0.94",
    "paho-mqtt>=2.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[project.scripts]
# accesia crear-camara … (RF-10 · C5), descargar-modelos, mcp (servidor MCP del agente) y semilla agente.
accesia = "accesia.comandos:principal"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    # La misma versión de Home Assistant: convierte los esquemas de las herramientas del MCP como lo hace él
    # (contrato agente · home assistant) y los arma para Ollama en scripts/cache_del_prompt.py.
    "probatio==0.13.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accesia"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-ra"
markers = [
    "marca(texto): código de la spec o del contrato que comprueba la prueba, por ejemplo «contrato MQTT · acl»",
]
